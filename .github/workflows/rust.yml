name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      rust_files: ${{ steps.filter.outputs.rust_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Rust file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust_files:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'

  fmt:
    needs: detect_changes
    if: needs.detect_changes.outputs.rust_files == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    needs: detect_changes
    if: needs.detect_changes.outputs.rust_files == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-build-${{ runner.os }}-

      - name: Build with Cargo
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --tests

      - name: Test
        run: cargo test

  voice:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ./.github/actions/setup-voice
      - name: Build native voice release
        run: cargo build --locked --release --features voice
      - name: Lint native voice
        run: cargo clippy --locked --tests --features voice
      - name: Test native voice
        run: cargo test --locked --features voice
      - name: Check public voice help
        shell: bash
        run: |
          target/release/cbl --cbl-api-key unused eval multi-turn --voice --help
